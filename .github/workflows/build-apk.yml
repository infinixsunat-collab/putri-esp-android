name: Build PUTRI ESP APK
on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java 17 (for SDK manager)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      
      - name: Install NDK 21
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.0.6113669"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$ANDROID_HOME/ndk/21.0.6113669" >> local.properties
      
      - name: Setup Java 11 (for Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      
      - name: Build APK (Debug - auto signed)
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PUTRI-ESP-Mod-APK
          path: app/build/outputs/apk/debug/*.apk
